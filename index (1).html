<style>
:root{--bg:#f6f5f1;--cd:#fff;--tx:#1f1d1a;--mu:#7a756c;--ac:#d9480f;--ok:#2b8a3e;--bd:#e2ded5;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--bd);background:var(--cd);border-radius:10px;padding:10px 12px}
.tabs{display:flex;gap:6px;padding:10px;position:sticky;top:0;background:var(--bg);z-index:5;overflow-x:auto}
.tabs:empty{display:none}
.tabs button{flex:1;white-space:nowrap;font-weight:600}
.tabs button.on,.chips button.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.wrap{padding:8px 10px 90px;max-width:900px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:8px}
.t{min-height:78px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}

.row{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}
.mu{color:var(--mu)}
.big{font-size:24px;font-weight:700}
.tag{font-size:12px;padding:2px 8px;border-radius:10px;background:#fab005;color:#1f1d1a}.tag.ok{background:var(--ok);color:var(--on)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sh{background:var(--bg);width:100%;max-width:640px;height:92%;overflow-y:auto;border-radius:16px 16px 0 0;padding:12px 12px calc(10px + env(safe-area-inset-bottom,0px))}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0}
.chips button{white-space:nowrap;padding:7px 12px;border-radius:20px}

.mg small{color:var(--mu);font-weight:400;font-size:13px}
.bd{position:absolute;top:3px;right:3px;background:var(--ac);color:var(--on);border-radius:10px;min-width:22px;padding:0 6px;font-size:13px}
.bar{position:sticky;bottom:0;background:var(--bg);padding:8px 0 2px;margin-top:10px;border-top:1px solid var(--bd)}
.pl{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.pl button{padding:4px 10px;border-radius:16px;font-size:14px}
.pay{width:100%;background:var(--ok);color:var(--on);border-color:var(--ok);font-weight:700;padding:13px;font-size:17px}
.pay.arm{background:var(--ac);border-color:var(--ac)}
input,textarea,select{background:var(--cd);border:1px solid var(--bd);border-radius:8px;padding:9px;width:100%}
select{width:auto}
.mr{display:flex;gap:6px;flex-wrap:wrap;padding:6px 0;border-bottom:1px solid var(--bd)}
.mr input{width:auto;min-width:0}
.msg{position:fixed;left:10px;right:10px;bottom:14px;background:var(--ac);color:var(--on);padding:10px;border-radius:10px;z-index:30;text-align:center}
.qrg{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.qc{text-align:center;padding:8px;border:1px solid var(--bd);border-radius:8px;background:#fff;color:#000;break-inside:avoid}
.qc>div:first-child{display:flex;justify-content:center}
@media print{.tabs,#msg,.noprint{display:none!important}body{background:#fff}}
</style></head>

let K=P.get("k")||"",S=null,closed=false,bad=false,rdy=false,unsubs=[],per={},fsd={},tmap={},db=null,auth=null,user=null,unsubO=null,orders=[],paid=[],menu=DEF,mv="1",sel=null,pend={},cat="전체",q="",built=null,armed=false,busy=false,ex=null,acx=null,draft=null,mrd=false,dbErr="",last=0,first=true,qrDone=false,actx=null;

const errCard=()=>'<div class="card">데이터베이스에 연결되지 않았어요. 인터넷 연결과 설정을 확인해 주세요.<br><b>원인: '+esc(dbErr||"알 수 없음")+'</b></div>';

async function guard(fn){try{await fn();return true}catch(e){toast(e&&e.code==="permission-denied"?"권한이 없어요.":"실패: "+(e&&e.message||e));return false}}
async function send(f,t){

}

/* ---------- 손님 화면 ---------- */

  const g={};orders.forEach(o=>{const x=g[o.name]=g[o.name]||{n:0,v:0,nw:0,ok:0,rd:0};x.n+=qty(o);x.v+=val(o);if(o.status==="new")x.nw+=qty(o);else if(o.status==="ready")x.rd+=qty(o);else x.ok+=qty(o)});

  fillMenu();fillBar();

/* ---------- 매니저 화면 ---------- */
const loginHtml=()=>'<div class="card"><b>관리자 비밀번호</b><input id="pw" type="password" placeholder="비밀번호" style="margin:8px 0"><button class="pay" data-a="login">입력</button><p class="mu" style="font-size:13px;margin:10px 0 0"><a data-a="setup" style="text-decoration:underline;cursor:pointer">처음이신가요? 비밀번호 정하기</a></p></div>';
function renderM(){
  const m=$("main"),tb=$("tabs");
  document.title=(newCount()?"("+newCount()+") ":"")+"주문";
  if(!db){tb.innerHTML="";m.innerHTML=errCard();return}
  if(!user){tb.innerHTML="";$("sheet").innerHTML="";built=null;if(!$("pw")&&!$("sp1"))m.innerHTML=loginHtml();return}
  const cnt=f=>new Set(orders.filter(o=>o.floor===f).map(o=>o.table)).size,nc=newCount(),uc=orders.filter(o=>o.status!=="ready").length;

    const f=+mv;let h=(Object.keys(tmap).length?"":'<div class="card">먼저 <b>QR</b> 탭에서 테이블 QR을 만들어 주세요.</div>')+'<div class="grid">';

function sheetRender(){

function kitHtml(){
  const l=orders.filter(o=>o.status!=="ready").sort((a,b)=>a.ts-b.ts);
  return l.length?'<div class="card">'+l.map(o=>`<div class="row"><span>${o.floor}층 ${o.table}번 · ${esc(o.name)} × ${qty(o)} ${o.status==="new"?'<span class="tag">신규</span>':""} <span class="mu">${hm(o.ts)}</span></span><button data-a="rd1" data-p="${esc(o._p)}">✓ 준비</button></div>`).join("")+'</div>':'<div class="card mu">준비할 메뉴가 없어요.</div>';

function newHtml(){
  const g={};orders.filter(o=>o.status==="new").forEach(o=>{const x=g[o.tkey]=g[o.tkey]||{f:o.floor,t:o.table,ts:o.ts,d:[]};x.d.push(o);x.ts=Math.min(x.ts,o.ts)});

function statHtml(){
  const cs={},it={},fl={1:0,2:0};
  paid.forEach(o=>{const c=cs[o.checkoutId]=cs[o.checkoutId]||{id:o.checkoutId,f:o.floor,t:o.table,at:o.paidAt,v:0,d:[]};c.v+=val(o);c.d.push(o);const i=it[o.name]=it[o.name]||{n:0,v:0};i.n+=qty(o);i.v+=val(o);fl[o.floor]=(fl[o.floor]||0)+val(o)});
  const list=Object.values(cs).sort((a,b)=>b.at-a.at);
  return `<button data-a="reload" style="margin-bottom:6px">새로고침</button><div class="card"><div class="mu">누적 매출</div><div class="big">${won(sum(paid))}</div><div class="mu">계산 ${list.length}건 · 1층 ${won(fl[1])} · 2층 ${won(fl[2])}</div><div class="mu">아직 계산 전: ${won(sum(orders))}</div></div>`+
  `<div class="card"><b>메뉴별 판매</b>`+(Object.keys(it).length?Object.entries(it).sort((a,b)=>b[1].n-a[1].n).map(([k,v])=>`<div class="row"><span>${esc(k)}</span><span>${v.n}개 · ${won(v.v)}</span></div>`).join(""):'<div class="mu">아직 없어요.</div>')+`</div>`+
  `<div class="card"><b>계산 내역</b>`+(list.length?list.map(c=>{const o=ex===c.id,g={};c.d.forEach(x=>{const y=g[x.name]=g[x.name]||{n:0,v:0};y.n+=qty(x);y.v+=val(x)});let h=`<div class="row" data-a="ex" data-c="${esc(c.id)}" style="cursor:pointer"><span>${hm(c.at)} · ${c.f}층 ${c.t}번</span><span>${won(c.v)} ${o?"▲":"▼"}</span></div>`;
    if(o)h+=`<div class="card" style="margin:0 0 8px">`+Object.keys(g).map(k=>`<div class="row"><span>${esc(k)} × ${g[k].n}</span><span>${won(g[k].v)} <button data-a="pdec" data-c="${esc(c.id)}" data-k="${esc(k)}">−</button> <button data-a="pinc" data-c="${esc(c.id)}" data-k="${esc(k)}">+</button></span></div>`).join("")+`<button class="pay ${acx===c.id?"arm":""}" style="margin-top:8px" data-a="cx" data-c="${esc(c.id)}">${acx===c.id?"한 번 더 누르면 계산 취소":"계산 취소 (테이블로 되돌리기)"}</button></div>`;return h}).join(""):'<div class="mu">아직 없어요.</div>')+`</div>`;
}
function menuHtml(){
  return '<div class="card"><b>한꺼번에 붙여넣기</b><p class="mu" style="margin:4px 0">한 줄에 하나씩: 이름 가격 분류 (분류는 생략 가능)<br>예) 라면 3500 분식</p><textarea id="bulk" rows="5"></textarea><button data-a="bulk" style="margin-top:6px">목록에 추가</button></div>'+
  '<div class="card"><b>메뉴 / 가격 / 분류</b>'+draft.map((x,i)=>`<div class="mr"><input data-k="name" data-i="${i}" value="${esc(x.name)}" placeholder="메뉴 이름" style="flex:2 1 120px"><input data-k="price" data-i="${i}" type="number" inputmode="numeric" value="${esc(x.price)}" style="flex:1 1 70px"><input data-k="cat" data-i="${i}" value="${esc(x.cat||"")}" placeholder="분류" style="flex:1 1 70px"><button data-a="mdel" data-i="${i}">삭제</button></div>`).join("")+
  '</div><button data-a="madd">+ 메뉴 추가</button> <button class="pay" style="margin-top:10px" data-a="msave">저장</button><p class="mu">저장하면 바로 반영돼요. 이름이 같은 메뉴끼리 주문이 묶이고, 계산 완료 때 그 시점의 가격으로 확정돼요.</p>';
}
function drawQR(){
  const g=$("qrg");if(!g||typeof QRCode==="undefined")return;
  const base=location.origin+location.pathname;
  for(const f of [1,2])for(let t=1;t<=N;t++){if(!tmap[f+"-"+t])continue;const d=document.createElement("div");d.className="qc";const c=document.createElement("div");d.appendChild(c);const l=document.createElement("div");l.textContent=f+"층 "+t+"번";d.appendChild(l);g.appendChild(d);new QRCode(c,{text:base+"?k="+tmap[f+"-"+t],width:120,height:120})}
}
async function loadPaid(){
  try{const rs=await Promise.all(Object.keys(tmap).map(k=>db.collection("t").doc(tmap[k]).collection("orders").where("done","==",true).get().then(sn=>sn.docs.map(d=>({...d.data(),id:d.id,_p:d.ref.path})))));paid=[].concat(...rs)}catch(e){toast("불러오기 실패: "+e.message)}
  if(mv==="stat")renderM();
}

/* ---------- 이벤트 ---------- */
async function doLogin(){try{await auth.signInWithEmailAndPassword(MGR_EMAIL,$("pw").value)}catch(err){toast("비밀번호가 맞지 않아요.")}}
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="pw")doLogin()});
const pendAny=()=>Object.keys(pend).some(i=>pend[i]);
function render(){MG?renderM():renderC()}
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,i=+b.dataset.i;
  if(a==="ov"&&e.target!==b)return;
  const fl=()=>MG?+mv:F,tb=()=>MG?sel:T;
  if(a==="login"){doLogin()}
  else if(a==="logout"){auth.signOut()}
  else if(a==="setup"){$("main").innerHTML='<div class="card"><b>관리자 비밀번호 정하기</b><p class="mu" style="margin:4px 0">처음 한 번만 하면 돼요. 6자 이상으로 정해 주세요.</p><input id="sp1" type="password" placeholder="비밀번호" style="margin:6px 0"><input id="sp2" type="password" placeholder="한 번 더 입력" style="margin-bottom:8px"><button class="pay" data-a="mkpw">정하기</button><button data-a="back" style="margin-top:8px;width:100%">돌아가기</button></div>'}
  else if(a==="back"){$("main").innerHTML="";render()}
  else if(a==="mkpw"){const p=$("sp1").value;if(p!==$("sp2").value){toast("두 비밀번호가 달라요.");return}
    try{await auth.createUserWithEmailAndPassword(MGR_EMAIL,p)}catch(err){toast(err.code==="auth/email-already-in-use"?"이미 비밀번호가 정해져 있어요.":err.code==="auth/weak-password"?"비밀번호는 6자 이상이어야 해요.":err.code==="auth/operation-not-allowed"?"Firebase에서 이메일/비밀번호 로그인을 켜 주세요.":"실패: "+err.message)}}
  else if(a==="restart"){closed=false;built=null;render()}
  else if(a==="v"){mv=b.dataset.v;sel=null;armed=false;acx=null;ex=null;draft=null;pend={};qrDone=false;if(mv==="stat")loadPaid();render()}
  else if(a==="reload"){loadPaid()}
  else if(a==="print"){window.print()}
  else if(a==="t"){sel=+b.dataset.t;armed=false;pend={};q="";cat="전체";render()}
  else if(a==="close"||a==="ov"){sel=null;armed=false;pend={};render()}
  else if(a==="cat"){cat=b.dataset.c;fillMenu()}
  else if(a==="add"){armed=false;if((pend[i]||0)>=20)return;pend[i]=(pend[i]||0)+1;fillMenu();fillBar()}
  else if(a==="pm"){pend[i]=(pend[i]||0)-1;if(pend[i]<=0)delete pend[i];fillMenu();fillBar()}
  else if(a==="clr"){pend={};fillMenu();fillBar()}
  else if(a==="send"){await send(fl(),tb())}
  else if(a==="dec"){armed=false;const k=b.dataset.k;if(!confirm(k+" 1개를 뺄까요?"))return;const l=open(+mv,sel).filter(o=>o.name===k).sort((p,r)=>r.ts-p.ts)[0];
    if(l)guard(()=>qty(l)>1?db.doc(l._p).update({qty:qty(l)-1}):db.doc(l._p).delete())}
  else if(a==="rdy"){const l=open(+mv,sel).filter(o=>o.name===b.dataset.k&&o.status!=="ready");await guard(async()=>{for(const o of l)await db.doc(o._p).update({status:"ready"})})}
  else if(a==="rd1"){await guard(()=>db.doc(b.dataset.p).update({status:"ready"}))}
  else if(a==="okt"){const l=open(+mv,sel).filter(o=>o.status==="new");await guard(async()=>{for(const o of l)await db.doc(o._p).update({status:"ok"})})}
  else if(a==="okg"){const l=orders.filter(o=>o.floor===+b.dataset.f&&o.table===+b.dataset.t&&o.status==="new");await guard(async()=>{for(const o of l)await db.doc(o._p).update({status:"ok"})})}
  else if(a==="pay"){
    if(pendAny()){toast("담아둔 메뉴를 먼저 [입력하기]로 보내거나 비워 주세요.");return}
    if(!armed){armed=true;render();return}
    if(busy)return;const f=+mv,t=sel,l=open(f,t),miss=l.find(o=>o.price==null&&!menu.some(x=>x.name===o.name));
    if(miss){armed=false;toast("'"+miss.name+"' 메뉴가 삭제돼 가격을 알 수 없어요. 메뉴에 다시 추가해 주세요.");render();return}
    if(l.some(o=>o.status!=="ready")&&!confirm("아직 준비 안 된 메뉴가 있어요. 그래도 계산 완료할까요?"))return;
    busy=true;const cid=Date.now()+"-"+f+"-"+t,at=Date.now();
    await guard(async()=>{const bt=db.batch();for(const o of l)bt.update(db.doc(o._p),{status:"paid",done:true,price:unit(o),checkoutId:cid,paidAt:at});bt.update(db.collection("tokens").doc(tmap[f+"-"+t]),{sess:FV().increment(1)});await bt.commit()});
    busy=false;armed=false;sel=null;render()}
  else if(a==="ex"){ex=ex===b.dataset.c?null:b.dataset.c;acx=null;render()}
  else if(a==="pdec"||a==="pinc"){const l=paid.filter(o=>o.checkoutId===b.dataset.c&&o.name===b.dataset.k).sort((p,r)=>r.ts-p.ts)[0];
    if(l){await guard(()=>a==="pinc"?db.doc(l._p).update({qty:qty(l)+1}):qty(l)>1?db.doc(l._p).update({qty:qty(l)-1}):db.doc(l._p).delete());loadPaid()}}
  else if(a==="cx"){const cid=b.dataset.c;if(acx!==cid){acx=cid;render();return}
    const l=paid.filter(o=>o.checkoutId===cid);
    const ok=await guard(async()=>{for(const o of l)await db.doc(o._p).update({done:false,status:"ok",checkoutId:FV().delete(),paidAt:FV().delete(),price:FV().delete()})});
    acx=null;ex=null;if(ok&&l[0])toast(l[0].floor+"층 "+l[0].table+"번 테이블로 되돌렸어요.");loadPaid()}
  else if(a==="mkqr"){const bt=db.batch();for(const f of [1,2])for(let t=1;t<=N;t++){const tok=Array.from(crypto.getRandomValues(new Uint8Array(12))).map(x=>x.toString(16).padStart(2,"0")).join("");bt.set(db.collection("tokens").doc(tok),{floor:f,table:t,sess:0})}
    if(await guard(()=>bt.commit())){qrDone=false;await listenM()}}
  else if(a==="madd"){draft.push({name:"",price:0,cat:""});mrd=true;render()}
  else if(a==="mdel"){draft.splice(i,1);mrd=true;render()}
  else if(a==="bulk"){
    let n=0;$("bulk").value.split("\n").forEach(ln=>{const m=ln.trim().match(/^(.+?)[\s,]+(\d[\d,]*)(?:[\s,]+(.*))?$/);if(m){draft.push({name:m[1].trim(),price:Number(m[2].replace(/,/g,""))||0,cat:(m[3]||"").trim()});n++}});
    if(!n){toast("읽을 수 있는 줄이 없어요. 이름 가격 분류 순서로 적어 주세요.");return}
    mrd=true;render();toast(n+"개를 추가했어요. 아래 [저장]을 눌러야 반영돼요.")}
  else if(a==="msave"){const items=draft.filter(x=>String(x.name).trim()).map(x=>({name:String(x.name).trim(),price:Number(x.price)||0,cat:String(x.cat||"").trim()}));
    await guard(async()=>{await db.collection("config").doc("menu").set({items});menu=items.length?items:DEF;draft=null;toast("메뉴를 저장했어요.");render()})}
});
document.addEventListener("input",e=>{const t=e.target;if(draft&&t.dataset.i!==undefined)draft[+t.dataset.i][t.dataset.k]=t.value});

/* ---------- 연결 ---------- */
function listenC(){
  unsubs.forEach(x=>x());unsubs=[];
  unsubs.push(db.collection("tokens").doc(K).onSnapshot(sn=>{
    if(!sn.exists){bad=true;render();return}
    const d=sn.data();F=d.floor;T=d.table;
    if(S===null)S=d.sess||0;else if((d.sess||0)!==S){S=d.sess||0;pend={};closed=true;built=null}
    render()},e=>{bad=true;toast("연결 오류: "+e.message);render()}));
  unsubs.push(db.collection("t").doc(K).collection("orders").where("done","==",false).onSnapshot(sn=>{
    if(rdy)sn.docChanges().forEach(c=>{if(c.type==="modified"&&c.doc.data().status==="ready"){toast(c.doc.data().name+" 준비됐어요!");beep();try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}}});
    rdy=true;orders=sn.docs.map(d=>({...d.data(),id:d.id,_p:d.ref.path}));render()},e=>toast("연결 오류: "+e.message)));
}
async function listenM(){
  unsubs.forEach(x=>x());unsubs=[];per={};fsd={};orders=[];
  try{const sn=await db.collection("tokens").get();tmap={};sn.docs.forEach(d=>{const x=d.data();tmap[x.floor+"-"+x.table]=d.id})}catch(e){toast("불러오기 실패: "+e.message)}
  Object.keys(tmap).forEach(k=>{
    unsubs.push(db.collection("t").doc(tmap[k]).collection("orders").where("done","==",false).onSnapshot(sn=>{
      if(fsd[k]){const add=sn.docChanges().filter(c=>c.type==="added"&&c.doc.data().status==="new");
        if(add.length){toast("신규 주문 · "+k.replace("-","층 ")+"번");beep();try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}}
      fsd[k]=true;
      per[k]=sn.docs.map(d=>({...d.data(),id:d.id,_p:d.ref.path,tkey:k}));
      orders=[].concat(...Object.values(per));render()},e=>toast("연결 오류: "+e.message)))});
  render();
}
try{
  if(typeof firebase==="undefined")throw new Error("Firebase 라이브러리를 불러오지 못했어요 (인터넷 연결, 광고 차단 확인)");
  if(!FIREBASE_CONFIG.projectId)throw new Error("FIREBASE_CONFIG의 projectId가 비어 있어요");
  firebase.initializeApp(FIREBASE_CONFIG);db=firebase.firestore();
  db.collection("config").doc("menu").onSnapshot(s=>{if(s.exists&&s.data().items&&s.data().items.length){menu=s.data().items;if(mv!=="menu"||!MG)render()}},()=>{});
  if(MG){auth=firebase.auth();auth.onAuthStateChanged(u=>{user=u;unsubs.forEach(x=>x());unsubs=[];per={};orders=[];$("main").innerHTML="";built=null;if(u)listenM();render()})}
  else if(K)listenC();
}catch(e){db=null;dbErr=e&&e.message||String(e)}
render();
</script>
</body></html>
